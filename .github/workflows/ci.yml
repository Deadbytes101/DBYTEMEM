name: native-ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  linux-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GCC warnings and tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O2 tests/test_arena.c -o arena_test
          ./arena_test
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O2 tests/test_policy_contract.c -o policy_contract_test
          ./policy_contract_test
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O2 tests/test_series_args.c -o series_args_test
          ./series_args_test
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O2 tests/test_disk_policy.c -o disk_policy_test
          ./disk_policy_test
      - name: Clang sanitizers and tests
        run: |
          clang -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_arena.c -o arena_san
          ./arena_san
          clang -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_policy_contract.c -o policy_contract_san
          ./policy_contract_san
          clang -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_series_args.c -o series_args_san
          ./series_args_san
          clang -std=c11 -Wall -Wextra -Werror -pedantic -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_disk_policy.c -o disk_policy_san
          ./disk_policy_san
  windows-native:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: MSVC x64 build and tests
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c11 /W4 /WX /O2 /TC src\dbmem.c /Fe:dbmem.exe /link psapi.lib
          if errorlevel 1 exit /b 1
          cl /nologo /std:c11 /W4 /WX /O2 /TC tests\test_arena.c /Fe:arena_test.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c11 /W4 /WX /O2 /TC tests\test_vm_win.c /Fe:arena_win_test.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c11 /W4 /WX /O2 /TC src\dbmem_policy.c /Fe:dbmem_policy.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c11 /W4 /WX /O2 /TC src\dbmem_series.c /Fe:dbmem_series.exe /link psapi.lib
          if errorlevel 1 exit /b 1
          cl /nologo /std:c11 /W4 /WX /O2 /TC src\dbmem_disk.c /Fe:dbmem_disk.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c11 /W4 /WX /O2 /TC tests\test_policy_contract.c /Fe:policy_contract_test.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c11 /W4 /WX /O2 /TC tests\test_series_args.c /Fe:series_args_test.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c11 /W4 /WX /O2 /TC tests\test_disk_policy.c /Fe:disk_policy_test.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c11 /W4 /WX /O2 /TC tests\test_policy_win.c /Fe:policy_win_test.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c11 /W4 /WX /O2 /TC bench\bench_alloc_win.c /Fe:bench_alloc_win.exe
          if errorlevel 1 exit /b 1
          policy_contract_test.exe
          if errorlevel 1 exit /b 1
          series_args_test.exe
          if errorlevel 1 exit /b 1
          disk_policy_test.exe
          if errorlevel 1 exit /b 1
          dbmem_disk.exe --help
          if errorlevel 1 exit /b 1
          dbmem_disk.exe --drive C --csv
          if errorlevel 5 exit /b 1
          if errorlevel 1 if not errorlevel 3 exit /b 1
          dbmem_disk.exe --warn-percent 0 >NUL 2>&1
          if not errorlevel 1 exit /b 1
          if errorlevel 2 exit /b 1
          dbmem_series.exe --samples 3 --interval-ms 100 --phase unclassified
          if errorlevel 1 exit /b 1
          arena_test.exe
          if errorlevel 1 exit /b 1
          arena_win_test.exe
          if errorlevel 1 exit /b 1
          dbmem.exe --help
          if errorlevel 1 exit /b 1
          dbmem.exe
          if errorlevel 1 exit /b 1
          dbmem.exe --interval-ms 100 >NUL 2>&1
          if not errorlevel 1 exit /b 1
          policy_win_test.exe
          if errorlevel 1 exit /b 1
          bench_alloc_win.exe
          if errorlevel 1 exit /b 1
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts\verify-native-windows.ps1
          if errorlevel 1 exit /b 1
